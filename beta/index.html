<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rex-Rotary Corrèze — Bêta propre</title>
<style>
html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#edf2f7;color:#14243b}.boot{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.boot-card{background:#fff;border:1px solid #d9e2ec;border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(20,36,59,.12);max-width:520px;width:100%}.boot-card h1{margin:0 0 8px;color:#0e2f68}.boot-card p{margin:0;color:#667085}.boot-error{color:#b42318;white-space:pre-wrap}
</style>
</head>
<body>
<div class="boot"><div class="boot-card"><h1>Rex-Rotary Corrèze</h1><p id="bootMsg">Chargement de la bêta propre…</p></div></div>
<script>
(async()=>{
  const msg=document.getElementById('bootMsg');
  try{
    const r=await fetch('../index.html?beta_source='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Impossible de charger la base V16 (HTTP '+r.status+').');
    let html=await r.text();

    // La bêta reste sans service worker pour éviter les anciens problèmes de cache.
    html=html.replace(/<link\s+rel=["']manifest["'][^>]*>/i,'');
    html=html.replace(/href=["']icon\.svg["']/i,'href="../icon.svg"');
    html=html.replace(/if\('serviceWorker'in navigator\)window\.addEventListener\('load',\(\)=>navigator\.serviceWorker\.register\('\.\/service-worker\.js'\)\.catch\(\(\)=>\{\}\)\);?/g,'');
    html=html.replace('</head>','<link rel="manifest" href="./manifest.webmanifest"><meta name="application-name" content="Rex-Rotary Corrèze"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Rex Corrèze"></head>');

    // Socle V16, puis modules bêta isolés et chargés dans un ordre fixe.
    const modules=[
      '../admin-seller.js?v=9',
      '../weekly-forecast.js?v=3',
      './monthly-forecast.js?v=1',
      '../ui-v3.js?v=2',
      './forecast-tabs.js?v=1',
      './forecast-form-wide.js?v=1',
      '../map-companies.js?v=2',
      './map-assign.js?v=1',
      './active-clients.js?v=1',
      './map-active-clients.js?v=1',
      './map-active-labels.js?v=1',
      './prospection-physique.js?v=1',
      '../tickets.js?v=1',
      './phoning.js?v=4',
      'https://cdn.jsdelivr.net/gh/thomasverdier-dot/rex-rotary-Correze@69b4e270773124dd283d92f32368a857d5f613e4/friday-point.js',
      './friday-weekly-entry.js?v=1',
      'https://cdn.jsdelivr.net/gh/thomasverdier-dot/rex-rotary-Correze@0eeb53b8fc07332bd8a0397e53a5f2435703c7e8/friday-actions.js',
      './friday-checklist.js?v=1',
      'https://cdn.jsdelivr.net/gh/thomasverdier-dot/rex-rotary-Correze@47ed7bccd85be765f1b29734863dbf37d5901a90/company-update.js',
      './nav-order.js?v=1'
    ];
    const closeScript='</scr'+'ipt>';
    const tags=modules.map(src=>'<script src="'+src+'">'+closeScript).join('');
    html=html.replace('</body>',tags+'</body>');

    html=html.replace('</body>','<div style="position:fixed;right:12px;top:10px;z-index:7000;background:#10233f;color:white;padding:6px 9px;border-radius:999px;font:700 10px Segoe UI,Arial">BÊTA SANS SERVICE WORKER</div></body>');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    msg.className='boot-error';
    msg.textContent='Erreur de chargement : '+(e?.message||e);
  }
})();
</script>
</body>
</html>
